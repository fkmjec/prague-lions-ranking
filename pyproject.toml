[project]
name = "prague-lions-ranking"
version = "0.1.0"
description = "A webapp to keep player rankings for frisbee matches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[project.scripts]
create-admin = "prague_lions_ranking.scripts.create_admin:create_admin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prague_lions_ranking"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
]
