<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prague Lions Ranking{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block header %}
    <div class="header">
        <h1>{% block page_title %}Prague Lions Ranking{% endblock %}</h1>
        <nav class="header-actions">
            <a href="/leaderboard" class="header-btn btn-home">Home</a>
            {% if is_admin %}<a href="/admin/leaderboard" class="header-btn btn-secondary">Private</a>{% endif %}
            {% if is_admin %}<a href="/dashboard" class="header-btn btn-secondary">Team</a>{% endif %}
            <a href="/matches" class="header-btn btn-secondary">Matches</a>
            <a href="/logout" class="header-btn logout-btn">Logout</a>
        </nav>
    </div>
    {% endblock %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
