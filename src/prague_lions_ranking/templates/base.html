<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prague Lions Ranking{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block header %}
    <div class="header">
        <h1>{% block page_title %}Prague Lions Ranking{% endblock %}</h1>
        <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <nav class="header-actions" id="main-nav">
            <a href="/leaderboard" class="header-btn btn-home">Home</a>
            {% if is_admin %}<a href="/dashboard" class="header-btn btn-secondary">Team</a>{% endif %}
            <a href="/matches" class="header-btn btn-secondary">Matches</a>
            <a href="/about" class="header-btn btn-secondary">About</a>
            <a href="/logout" class="header-btn logout-btn">Logout</a>
        </nav>
    </div>
    {% endblock %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script>
    (function() {
        var toggle = document.getElementById('nav-toggle');
        var nav = document.getElementById('main-nav');
        if (!toggle) return;
        toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            var open = nav.classList.toggle('nav-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.header')) {
                nav.classList.remove('nav-open');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    })();
    </script>
</body>
</html>
